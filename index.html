    <!-- "only light": impide que Chrome/Samsung Internet oscurezcan la página cuando el celular está en modo oscuro. -->

    <!-- Pide a extensiones de modo oscuro (Dark Reader y similares) que no oscurezcan la página. -->

    <title>Ítaca · Joyas con historia</title>
    <meta name="description" content="Aros, pulseras y carteras tejidos a mano, una a una. Pide por WhatsApp o Instagram." />

         los links usan #/… y los lectores de vista previa no ejecutan la app. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Ítaca" />

    />
